; STM32H743 Device Initialization File
; Configuration for STM32CubeH7 firmware

;*****************************************************************************
; Startup Code
;*****************************************************************************

; Clock Configuration
#define RCC_CR_HSION    0x00000001
#define RCC_CR_HSIRDY   0x00000004
#define RCC_CR_PLLON    0x01000000
#define RCC_CR_PLLRDY   0x02000000
#define RCC_CFGR_SW_PLL 0x00000003

; NVIC Configuration
#define NVIC_VTOR       0xE000ED08
#define SCB_AIRCR       0xE000ED0C

; Peripheral Enable
#define RCC_AHB1ENR     0x40023830
#define RCC_AHB3ENR     0x40023838
#define RCC_APB1ENR     0x40023840
#define RCC_APB2ENR     0x40023844

; GPIO Port Enable
#define GPIOA_EN        0x00000001
#define GPIOB_EN        0x00000002
#define GPIOD_EN        0x00000008
#define GPIOE_EN        0x00000010

; UART1 Enable
#define USART1_EN       0x00000010

; USB OTG HS Enable
#define USB_OTG_HS_EN   0x00000080

; FSMC Enable (for TFT)
#define FSMC_EN         0x00000001

; DMA2D Enable (for graphics acceleration)
#define DMA2D_EN        0x00000001
